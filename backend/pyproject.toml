[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "therados"
version = "1.0.0"
description = "TheraDOS: Therapeutic Domain Operating System Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "neo4j>=5.18.0",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "rdkit>=2023.9.5",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "networkx>=3.2.1",
    "boto3>=1.34.0",
    "temporalio>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.setuptools]
packages = [
    "therados", "therados.api", "therados.config", "therados.db", "therados.models", "therados.schemas",
    "scientific", "scientific.digital_twin", "scientific.endotypes", "scientific.evidence", "scientific.experiments", "scientific.falsification", "scientific.genetics", "scientific.graphs", "scientific.hypothesis_compiler", "scientific.pharmacology", "scientific.phenotype_inversion", "scientific.portfolio",
    "integrations", "integrations.model_providers", "integrations.molecular_tools", "integrations.public_data"
]

[tool.setuptools.package-dir]
"therados" = "therados"
"scientific" = "../scientific"
"integrations" = "../integrations"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
ignore = ["UP006", "UP035", "UP045", "UP017", "I001", "B008", "BLE001", "LOG015"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = [".", ".."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
