name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e .[dev] || pip install -e .

      - name: Lint with Ruff
        run: |
          cd backend
          ruff check .

      - name: Typecheck with mypy
        run: |
          cd backend
          mypy therados

      - name: Run pytest
        run: |
          cd backend
          pytest

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd apps/web
          npm ci || npm install

      - name: Typecheck & Build
        run: |
          cd apps/web
          npm run typecheck
          npm run build
